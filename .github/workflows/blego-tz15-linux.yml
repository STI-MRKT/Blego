name: BLEGO TZ15 classifier and FB.Tools verification
on:
  push:
    branches:
      - codex/blego-tz15-fbtools-classifier-integrated-20261117
      - codex/blego-tz17-adaptive-classifier-20261118
      - codex/blego-metapainter-export-inspection-20261118
      - codex/blego-metapainter-default-confirm-finder-20261118
      - codex/blego-classifier-layout-headers-20261118
      - codex/blego-news-hide-partial-source-warning-20261118
      - codex/blego-tz19-adaptive-confirmed-layouts-20261118
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Formatter review
        run: |
          for file in shared/classifier-adaptive.mjs tests/unit/tz19-adaptive-layouts.test.cjs tests/unit/tz18-header-matrix.test.cjs tests/unit/metapainter-export-info.test.cjs tests/ui/metapainter-export-info.test.cjs shared/classifier-structure.mjs tests/unit/tz17-ui.test.cjs shared/classifier.mjs tests/unit/tz17-adaptive.test.cjs tests/unit/tz16-ux.test.cjs tests/ui/classifier-tz15.test.cjs tests/ui/facebook-v14.test.cjs tests/unit/fbtools-checker-ui.test.cjs tests/ui/friends-bulk-copy.test.cjs tests/ui/friends.test.cjs tests/ui/photos-v143.test.cjs tests/unit/classifier-tz15.test.cjs tests/unit/phone-display.test.cjs tests/unit/tz14-hotfix.test.cjs tests/ui/generator-phone-address.test.cjs tests/ui/ux-restoration.test.cjs scripts/check-installed-app.cjs shared/classifier-lexer.mjs electron/features/generator/biography.cjs electron/features/generator/service.cjs tests/unit/tz15-generator-ux.test.cjs; do
            echo "FORMAT_START:$file"
            ./node_modules/.bin/prettier "$file" | base64 -w 0
            echo
            echo "FORMAT_END:$file"
          done
      - name: Targeted TZ15 unit tests
        run: node --test tests/unit/tz18-header-matrix.test.cjs tests/unit/metapainter-export-info.test.cjs tests/unit/tz17-ui.test.cjs tests/unit/tz17-adaptive.test.cjs tests/unit/classifier-tz15.test.cjs tests/unit/tz15-generator-ux.test.cjs tests/integration/facebook-fbtools.test.cjs
      - name: MetaPainter focused Electron GUI
        run: |
          npm run prepare:metadata
          node node_modules/electron/install.js
          xvfb-run -a env BLEGO_HEADLESS=1 node --test --test-concurrency=1 tests/ui/metapainter-export-info.test.cjs
      - name: News partial-source warning regression
        run: node --test tests/unit/news-partial-warning.test.cjs
      - name: TZ19 adaptive + confirmed-layout tests
        run: node --test tests/unit/tz19-adaptive-layouts.test.cjs
      - name: Lint
        run: npm run lint
      - name: Unit and integration regression
        run: |
          npm run test:unit
          npm run test:integration
      - name: Targeted native Electron GUI
        run: |
          node node_modules/electron/install.js
          xvfb-run -a env BLEGO_HEADLESS=1 node --test --test-concurrency=1 tests/ui/classifier-tz13.test.cjs tests/ui/classifier-tz15.test.cjs tests/ui/classifier-copy.test.cjs tests/ui/facebook-flow.test.cjs tests/ui/facebook-v14.test.cjs tests/ui/friends.test.cjs tests/ui/friends-bulk-copy.test.cjs tests/ui/generator-phone-address.test.cjs tests/ui/photos-v143.test.cjs tests/ui/metapainter-export-info.test.cjs tests/ui/news-copy.test.cjs
