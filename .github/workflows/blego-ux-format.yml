name: BLEGO UX source formatting (one-time)

on:
  push:
    branches:
      - codex/blego-ux-restoration-20261112

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[ux-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Format only edited source and tests
        run: |
          npx prettier --write src/js/ui/network.js src/js/ui/generator.js src/js/ui/news.js src/js/ui/photos.js src/js/ui/settings.js src/js/main.js tests/ui/app.test.cjs tests/ui/image-groups.test.cjs tests/ui/ux-restoration.test.cjs scripts/check-installed-app.cjs
          npm run format:check
      - name: Commit the formatting without touching main or PR 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/ui/network.js src/js/ui/generator.js src/js/ui/news.js src/js/ui/photos.js src/js/ui/settings.js src/js/main.js tests/ui/app.test.cjs tests/ui/image-groups.test.cjs tests/ui/ux-restoration.test.cjs scripts/check-installed-app.cjs
          if ! git diff --cached --quiet; then
            git commit -m "style(ux): apply project Prettier settings"
            git push origin HEAD:codex/blego-ux-restoration-20261112
          fi
      - run: npm run lint
