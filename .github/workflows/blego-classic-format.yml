name: BLEGO classic UX formatting and unit gate

on:
  push:
    branches:
      - codex/blego-classic-ux-functional-20261112

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[classic-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Format changed JavaScript, no graphic or CSS changes
        run: |
          npx prettier --write \
            src/js/main.js src/js/state.js src/js/services/news.js \
            src/js/ui/shell.js src/js/ui/generator.js src/js/ui/network.js \
            src/js/ui/news.js src/js/ui/history.js src/js/ui/checker.js \
            src/js/ui/photos.js src/js/ui/settings.js \
            electron/main.cjs electron/features/proxy/providers.cjs \
            electron/features/proxy/assessment.cjs electron/features/proxy/proxycheck.cjs \
            shared/news-catalog.mjs tests/unit/classic-functions.test.cjs \
            tests/ui/app.test.cjs tests/ui/copy-all-sections.test.cjs \
            tests/ui/image-groups.test.cjs tests/ui/classic-workflows.test.cjs \
            scripts/check-installed-app.cjs
          npm run lint
          npm run test:unit
      - name: Commit formatting only to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js electron/main.cjs electron/features/proxy/providers.cjs electron/features/proxy/assessment.cjs electron/features/proxy/proxycheck.cjs shared/news-catalog.mjs tests/unit/classic-functions.test.cjs tests/ui/app.test.cjs tests/ui/copy-all-sections.test.cjs tests/ui/image-groups.test.cjs tests/ui/classic-workflows.test.cjs scripts/check-installed-app.cjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format changed classic BLEGO JavaScript only"
            git push origin HEAD:codex/blego-classic-ux-functional-20261112
          fi
