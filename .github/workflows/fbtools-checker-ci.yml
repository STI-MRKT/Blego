name: FB.Tools Checker targeted QA

on:
  push:
    branches:
      - codex/blego-fbtools-checker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Lint and formatting
        run: npm run lint
      - name: Capture formatted sources for review
        if: failure()
        run: |
          ./node_modules/.bin/prettier --write electron/features/facebook/fbtools.cjs shared/facebook-presentation.mjs tests/integration/facebook-fbtools.test.cjs tests/ui/facebook-flow.test.cjs tests/ui/facebook-v14.test.cjs scripts/check-fbtools-native.cjs
          for f in electron/features/facebook/fbtools.cjs shared/facebook-presentation.mjs tests/integration/facebook-fbtools.test.cjs tests/ui/facebook-flow.test.cjs tests/ui/facebook-v14.test.cjs scripts/check-fbtools-native.cjs; do
            echo "BLEGO_FORMATTED_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "BLEGO_FORMATTED_END:$f"
          done
      - name: Targeted Facebook unit tests
        run: node --test tests/unit/facebook-*.test.cjs tests/unit/fbtools-checker-ui.test.cjs
      - name: Targeted Facebook integration tests
        run: node --test tests/integration/facebook-*.test.cjs
      - name: All unit and integration regressions
        run: npm run verify
