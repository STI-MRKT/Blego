name: BLEGO scoped classifier and News QA

on:
  push:
    branches:
      - codex/blego-qa-prettier-helper-20261117

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/blego-news-copy-restore-20261117
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Password, GEO and News unit regression
        run: node --test tests/unit/classifier-password-geo-v146.test.cjs tests/unit/news-copy.test.cjs
      - name: Full classifier QA
        run: npm run test:classifier
      - name: Lint
        run: npm run lint
      - name: Classifier quality checks
        run: |
          node scripts/check-classifier-v142.cjs
          node scripts/check-classifier-v143.cjs /tmp/blego-v143-quality.json
