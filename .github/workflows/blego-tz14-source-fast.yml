name: BLEGO TZ14 independent QA

on:
  push:
    branches:
      - codex/blego-tz14-hotfix-ui-pools-20261117

permissions:
  contents: read

jobs:
  source:
    if: contains(github.event.head_commit.message, '[tz14-qa-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Export formatted files for review
        shell: bash
        run: |
          for file in electron/features/generator/pool-expansion.cjs tests/integration/generator-tz12.test.cjs tests/integration/pool-registry-migration.test.cjs tests/ui/archive-actions.test.cjs tests/ui/generator-picker-tz12.test.cjs tests/ui/generator-bio.test.cjs tests/unit/generator-phone-address.test.cjs tests/unit/generator-tz12.test.cjs tests/unit/tz14-hotfix.test.cjs; do
            echo "TZ14_FORMAT_BEGIN:$file"
            ./node_modules/.bin/prettier "$file" | base64 -w 0
            echo
            echo "TZ14_FORMAT_END:$file"
          done
      - run: ./node_modules/.bin/prettier --write electron/features/generator/pool-expansion.cjs tests/integration/generator-tz12.test.cjs tests/integration/pool-registry-migration.test.cjs tests/ui/archive-actions.test.cjs tests/ui/generator-picker-tz12.test.cjs tests/ui/generator-bio.test.cjs tests/unit/generator-phone-address.test.cjs tests/unit/generator-tz12.test.cjs tests/unit/tz14-hotfix.test.cjs
      - name: Verify full unit/integration and targeted hotfix
        run: |
          node --test tests/integration/generator-tz12.test.cjs
          npm run lint
          node --test tests/unit/tz14-hotfix.test.cjs
          npm run verify
