name: BLEGO UX macOS M1 QA build

on:
  push:
    branches:
      - codex/blego-ux-restoration-20261112
      - codex/blego-classifier-next
      - codex/blego-final-hardening
      - codex/blego-v1-4-improvements
      - codex/blego-v1-4-1-fixes
  workflow_dispatch:
    inputs:
      target:
        description: Mac architecture
        required: true
        type: choice
        default: arm64
        options:
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: blego-qa-mac-${{ github.ref }}-${{ inputs.target || 'arm64' }}
  cancel-in-progress: false

jobs:
  lint:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac-qa-run]') || contains(github.event.head_commit.message, '[mac-qa-run-x64]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run lint
  mac:
    needs: lint
    # A marked QA commit deliberately starts one native validation job.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac-qa-run]') || contains(github.event.head_commit.message, '[mac-qa-run-x64]') }}
    runs-on: ${{ (contains(github.event.head_commit.message, '[mac-qa-run-x64]') || inputs.target == 'x64') && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BLEGO_CAPTURE_UX: '1'
      BLEGO_CAPTURE: release
      TARGET_ARCH: ${{ contains(github.event.head_commit.message, '[mac-qa-run-x64]') && 'x64' || inputs.target || 'arm64' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Restore compiled Mac Perl cache
        id: metadata-cache
        uses: actions/cache@v4
        with:
          path: build/metadata-runtime/darwin-${{ env.TARGET_ARCH }}
          key: blego-verified-perl-5.40.1-${{ runner.os }}-${{ env.TARGET_ARCH }}-v1
      - name: Prepare native Perl / ExifTool runtime
        run: bash scripts/prepare-metadata-darwin.sh
      - name: Native read-write-readback gate
        run: |
          mkdir -p release
          node scripts/check-metadata-native.cjs --target darwin-${{ env.TARGET_ARCH }} --root build/metadata-runtime/darwin-${{ env.TARGET_ARCH }} --report release/native-darwin-${{ env.TARGET_ARCH }}.json
      - name: Cache runtime only after native read-write-readback gate
        if: steps.metadata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/metadata-runtime/darwin-${{ env.TARGET_ARCH }}
          key: blego-verified-perl-5.40.1-${{ runner.os }}-${{ env.TARGET_ARCH }}-v1
      - name: Test
        run: |
          set -o pipefail
          npm run verify | tee release/verification-native.log
      - name: Prepare identical BLEGO 1.4 performance reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/blego-baseline-reference" 95b80ff302fafef8c395169d4fe5e23019d37f31
          (cd "$RUNNER_TEMP/blego-baseline-reference" && npm ci && node node_modules/electron/install.js)
          mkdir -p "$RUNNER_TEMP/blego-baseline-reference/build/metadata-runtime"
          ln -s "$GITHUB_WORKSPACE/build/metadata-runtime/darwin-$TARGET_ARCH" "$RUNNER_TEMP/blego-baseline-reference/build/metadata-runtime/darwin-$TARGET_ARCH"
      - name: Package baseline14 in the same environment
        run: |
          (cd "$RUNNER_TEMP/blego-baseline-reference" && npm run dist:mac -- --${{ env.TARGET_ARCH }} --dir)
          baseline_dir="mac-$TARGET_ARCH"
          if [ "$TARGET_ARCH" = x64 ]; then baseline_dir=mac; fi
          ditto "$RUNNER_TEMP/blego-baseline-reference/release/$baseline_dir/BLEGO.app" "$RUNNER_TEMP/BLEGO-baseline14.app"
          ELECTRON_RUN_AS_NODE=1 "$RUNNER_TEMP/BLEGO-baseline14.app/Contents/MacOS/BLEGO" scripts/check-packaged-dependencies.cjs "$RUNNER_TEMP/BLEGO-baseline14.app/Contents/Resources/app.asar"
      - name: Comparable manual metadata baseline and candidate
        run: |
          BLEGO_QA_PROJECT="$RUNNER_TEMP/blego-baseline-reference" node scripts/check-metadata-load.cjs release/metadata-load-baseline14.json
          node scripts/check-metadata-load.cjs release/metadata-load-candidate-manual.json
      - name: Licensed real high-resolution photograph comparison
        run: |
          curl --fail --location --retry 2 --max-time 90 --max-filesize 20971520 --output "$RUNNER_TEMP/Fronalpstock-original.jpg" https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg
          node scripts/check-real-photo.cjs "$RUNNER_TEMP/blego-baseline-reference" "$RUNNER_TEMP/Fronalpstock-original.jpg" release/real-photo-baseline14.json
          node scripts/check-real-photo.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/Fronalpstock-original.jpg" release/real-photo-candidate.json
      - name: Date and GEO native load acceptance
        run: BLEGO_FOLDER_LOAD=1 node scripts/check-metadata-load.cjs release/metadata-load-darwin.json
      - name: Build unsigned DMG
        run: npm run dist:mac -- --${{ env.TARGET_ARCH }}
      - name: Verify packaged executable (outside repo)
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/blego-dmg-mounted"
          mkdir -p "$mountpoint"
          hdiutil attach release/*-${{ env.TARGET_ARCH }}.dmg -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          ditto "$mountpoint/BLEGO.app" "$RUNNER_TEMP/BLEGO-qa.app"
          ELECTRON_RUN_AS_NODE=1 "$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" scripts/check-packaged-dependencies.cjs "$RUNNER_TEMP/BLEGO-qa.app/Contents/Resources/app.asar"
          if ! node scripts/check-installed-app.cjs --executable "$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" --report release/installed-darwin-${{ env.TARGET_ARCH }}.json; then
            echo "::error::Packaged app validation failed; diagnostics:"
            cat release/installed-darwin-${{ env.TARGET_ARCH }}.json.log || true
            exit 1
          fi
      - name: Installed photo batch and original UX comparison
        run: |
          BLEGO_EXECUTABLE="$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" node scripts/check-metadata-ui-batch.cjs > release/metadata-ui-batch-darwin.log
          BLEGO_GUI_FOLDER_COUNT=20 BLEGO_EXECUTABLE="$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" node scripts/check-metadata-ui-batch.cjs > release/metadata-ui-folder20-darwin.log
          git worktree add --detach "$RUNNER_TEMP/blego-original-reference" 6e57eabfb5b51af4475b90686fa580b5ce57e9b0
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/blego-original-reference/node_modules"
          node scripts/check-ux-performance.cjs --original "$RUNNER_TEMP/blego-original-reference" --baseline "$RUNNER_TEMP/blego-baseline-reference" --baseline-executable "$RUNNER_TEMP/BLEGO-baseline14.app/Contents/MacOS/BLEGO" --executable "$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" --report release/ux-performance-darwin.json
      - name: Bounded live public-service observations
        run: BLEGO_EXECUTABLE="$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" node scripts/check-public-services.cjs release/public-services-native.json
      - name: Record checksums
        run: |
          (cd release && shasum -a 256 *.dmg) > release/SHA256SUMS-mac.txt
          sw_vers > release/macOS-env.txt
          uname -m >> release/macOS-env.txt
          sysctl -n hw.model >> release/macOS-env.txt
          sysctl -n machdep.cpu.brand_string >> release/macOS-env.txt
          git rev-parse HEAD >> release/macOS-env.txt
          cat release/SHA256SUMS-mac.txt
          echo 'QA only; not notarized or Developer ID signed' >> release/macOS-env.txt
      - name: Prepare install ZIP after installed-app acceptance
        run: |
          install_arch="$(printf '%s' "$TARGET_ARCH" | tr '[:lower:]' '[:upper:]')"
          cp docs/verification/v141/INSTALL-RU.txt release/INSTALL-RU.txt
          zip -j "release/BLEGO-1.4.1-macOS-$install_arch-install.zip" release/*-$TARGET_ARCH.dmg release/SHA256SUMS-mac.txt release/INSTALL-RU.txt
          unzip -t "release/BLEGO-1.4.1-macOS-$install_arch-install.zip"
          (cd release && shasum -a 256 *-install.zip) > release/SHA256SUMS-zip.txt
      - name: Upload QA packages after all gates
        uses: actions/upload-artifact@v4
        with:
          name: BLEGO-mac-${{ env.TARGET_ARCH }}-QA
          retention-days: 5
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-install.zip
            release/INSTALL-RU.txt
            release/SHA256SUMS-zip.txt
            release/real-photo-*.json
            release/responsive-native.json
            release/verification-native.log
            release/public-services-native.json
            release/metadata-ui-folder20-*.log
            release/*.png
            release/ux-performance-*.json
            release/metadata-load-*.json
            release/metadata-ui-batch-*.log
            release/SHA256SUMS-mac.txt
            release/macOS-env.txt
            release/native-darwin-*.json
            release/installed-darwin-*.json
            release/installed-darwin-*.json.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BLEGO-mac-${{ env.TARGET_ARCH }}-failure-logs
          retention-days: 3
          if-no-files-found: warn
          path: |
            release/installed-darwin-*.json
            release/installed-darwin-*.json.log
            release/native-darwin-*.json
            release/metadata-load-*.json
            release/metadata-ui-batch-*.log
            release/metadata-ui-folder20-*.log
            release/real-photo-*.json
            release/responsive-native.json
            release/verification-native.log
            release/public-services-native.json
            release/ux-performance-*.json
            release/*.png
