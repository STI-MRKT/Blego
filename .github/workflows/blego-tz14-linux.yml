name: BLEGO TZ14 Linux validation
on:
  push:
    branches:
      - codex/blego-tz14-hotfix-20261117
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Static analysis and formatting
        run: npm run lint
      - name: Unit and integration regression
        run: npm run verify
