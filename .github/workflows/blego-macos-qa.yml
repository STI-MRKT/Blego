name: BLEGO macOS QA build (manual, unsigned)

on:
  push:
    branches:
      - codex/macos-qa-bootstrap-20261112
      - codex/blego-original-ux-v13
  workflow_dispatch:
    inputs:
      target:
        description: Mac architecture
        required: true
        type: choice
        default: arm64
        options:
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: blego-qa-mac-${{ github.ref }}-${{ inputs.target || 'arm64' }}
  cancel-in-progress: false

jobs:
  lint:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac-qa-run]') || contains(github.event.head_commit.message, '[mac-qa-run-x64]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run lint
  mac:
    needs: lint
    # Private repository: a marked commit deliberately authorizes one compute-consuming job.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac-qa-run]') || contains(github.event.head_commit.message, '[mac-qa-run-x64]') }}
    runs-on: ${{ (contains(github.event.head_commit.message, '[mac-qa-run-x64]') || inputs.target == 'x64') && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TARGET_ARCH: ${{ contains(github.event.head_commit.message, '[mac-qa-run-x64]') && 'x64' || inputs.target || 'arm64' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Restore compiled Mac Perl cache
        uses: actions/cache@v4
        with:
          path: build/metadata-runtime/darwin-${{ env.TARGET_ARCH }}
          key: blego-verified-perl-5.40.1-${{ runner.os }}-${{ env.TARGET_ARCH }}-v1
      - name: Prepare native Perl / ExifTool runtime
        run: bash scripts/prepare-metadata-darwin.sh
      - name: Native read-write-readback gate
        run: |
          mkdir -p release
          node scripts/check-metadata-native.cjs --target darwin-${{ env.TARGET_ARCH }} --root build/metadata-runtime/darwin-${{ env.TARGET_ARCH }} --report release/native-darwin-${{ env.TARGET_ARCH }}.json
      - name: Test
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee release/verify.txt
      - name: Build unsigned DMG
        run: npm run dist:mac -- --${{ env.TARGET_ARCH }}
      - name: Verify packaged executable (outside repo)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blego-dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/blego-dmg" || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/blego-dmg" release/BLEGO-*-${{ env.TARGET_ARCH }}.dmg
          ditto "$RUNNER_TEMP/blego-dmg/BLEGO.app" "$RUNNER_TEMP/BLEGO-qa.app"
          hdiutil detach "$RUNNER_TEMP/blego-dmg"
          trap - EXIT
          if ! node scripts/check-installed-app.cjs --executable "$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" --report release/installed-darwin-${{ env.TARGET_ARCH }}.json; then
            echo "::error::Packaged app validation failed; diagnostics:"
            cat release/installed-darwin-${{ env.TARGET_ARCH }}.json.log || true
            exit 1
          fi
      - name: Boundary and installed batch measurements
        run: |
          set -o pipefail
          node scripts/check-metadata-resources.cjs 2>&1 | tee release/resources.txt
          BLEGO_EXECUTABLE="$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" node scripts/check-metadata-ui-batch.cjs 2>&1 | tee release/batch-100.txt
          BLEGO_EXECUTABLE="$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" node scripts/check-metadata-ui-batch.cjs --mixed 2>&1 | tee release/batch-mixed.txt
      - name: Original and installed screenshots and measured UI timing
        run: |
          git worktree add --detach "$RUNNER_TEMP/blego-original" 6e57eabfb5b51af4475b90686fa580b5ce57e9b0
          (cd "$RUNNER_TEMP/blego-original" && npm ci && node node_modules/electron/install.js)
          node scripts/capture-ux-candidate.cjs --root "$RUNNER_TEMP/blego-original" --label original --out release/visual
          BLEGO_EXECUTABLE="$RUNNER_TEMP/BLEGO-qa.app/Contents/MacOS/BLEGO" node scripts/capture-ux-candidate.cjs --root "$PWD" --label candidate --out release/visual
      - name: Record checksums
        run: |
          shasum -a 256 release/*.dmg > release/SHA256SUMS-mac.txt
          sw_vers > release/macOS-env.txt
          uname -m >> release/macOS-env.txt
          sysctl -n machdep.cpu.brand_string >> release/macOS-env.txt
          git rev-parse HEAD >> release/macOS-env.txt
          echo 'QA only; not notarized or Developer ID signed' >> release/macOS-env.txt
      - name: Upload private QA packages
        uses: actions/upload-artifact@v4
        with:
          name: BLEGO-mac-${{ env.TARGET_ARCH }}-QA
          retention-days: 5
          if-no-files-found: error
          path: |
            release/visual/
            release/verify.txt
            release/resources.txt
            release/batch-*.txt
            release/*.dmg
            release/SHA256SUMS-mac.txt
            release/macOS-env.txt
            release/native-darwin-*.json
            release/native-runtime-*.json
            release/installed-darwin-*.json
            release/installed-darwin-*.json.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BLEGO-mac-${{ env.TARGET_ARCH }}-failure-logs
          retention-days: 3
          if-no-files-found: warn
          path: |
            release/installed-darwin-*.json
            release/installed-darwin-*.json.log
            release/native-darwin-*.json
            release/native-runtime-*.json
