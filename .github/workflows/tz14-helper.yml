name: BLEGO TZ14 isolated tests and formatter
# rerun corrected pool aggregate accounting
# rerun with current source, full history and corrected TZ14 pool tests
on:
  push:
    branches:
      - codex/blego-tz14-ci-helper-20261117
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/blego-tz14-hotfix-20261117
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Format changed files for commit
        run: |
          for file in tests/ui/copy-all-sections.test.cjs scripts/check-installed-app.cjs; do
            echo "FORMAT_START:$file"
            ./node_modules/.bin/prettier "$file" | base64 -w 0
            echo
            echo "FORMAT_END:$file"
          done
      - name: TZ14 contract tests and pool audit
        run: |
          node --test tests/unit/tz14-hotfix.test.cjs
          node scripts/tz14-pool-report.cjs /tmp/blego-tz14-pool-report.json
      - name: Targeted Electron GUI checks
        run: |
          node node_modules/electron/install.js
          npm run prepare:metadata
          xvfb-run -a env BLEGO_HEADLESS=1 node --test --test-concurrency=1 tests/ui/archive-actions.test.cjs tests/ui/copy-all-sections.test.cjs tests/ui/generator-v14.test.cjs tests/ui/header-copy-removed.test.cjs
      - name: Syntax check
        run: node scripts/check.cjs
