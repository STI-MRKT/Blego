name: QA formatting and focused verification

on:
  push:
    branches:
      - codex/blego-qa-prettier-helper-20261117

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/blego-tz13-classifier
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Export formatter result
        run: |
          echo QA_FORMAT_BEGIN
          ./node_modules/.bin/prettier shared/classifier-lexer.mjs | base64 -w 0
          echo
          echo QA_FORMAT_END
      - name: Focused tests
        run: node --test tests/unit/classifier-multiformat-qa.test.cjs tests/unit/classifier-v143.test.cjs tests/integration/classifier-v143.test.cjs
