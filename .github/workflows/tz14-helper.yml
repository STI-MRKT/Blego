name: BLEGO TZ14 isolated tests and formatter
# rerun with current source, full history and corrected TZ14 pool tests
on:
  push:
    branches:
      - codex/blego-tz14-ci-helper-20261117
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/blego-tz14-hotfix-20261117
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Format changed files for commit
        run: |
          for file in tests/ui/app.test.cjs tests/ui/generator-bio.test.cjs tests/ui/generator-picker-tz12.test.cjs scripts/tz14-pool-report.cjs tests/unit/biography-v141.test.cjs tests/unit/pool-catalog.test.cjs tests/integration/pool-registry-migration.test.cjs tests/integration/generator-tz12.test.cjs tests/unit/generator-tz12.test.cjs tests/ui/archive-actions.test.cjs tests/ui/ux-restoration.test.cjs; do
            echo "FORMAT_START:$file"
            ./node_modules/.bin/prettier "$file" | base64 -w 0
            echo
            echo "FORMAT_END:$file"
          done
      - name: Syntax check
        run: node scripts/check.cjs
